Project: RefractiveCorresDataset
project_name: prism_main
output_folder: ./result
split_kind: main

# Fixed-camera, moving-object paired synthetic video.
ior_range: [1.3, 1.65]
backgrounds_per_shape: 8
sequence_num_per_background: 4
frames_per_sequence: 8
dataset_seed: 20260817

# Reserve disjoint meshes and backgrounds from the training resource lists.
# The held-out test resource lists remain untouched.
ValidationSplit:
  enabled: true
  fraction: 0.10
  seed: 20260819

PairedBackground:
  # The same mesh, IOR, RGB transmission, camera and object trajectory are
  # reused across background_index values with one shared group id.
  enabled: true

Reflection:
  # Main split is refraction/transmission dominant.
  enabled: false
  zero_probability: 1.0
  reflection_scale_range: [0.0, 0.0]

MaterialRandomization:
  enabled: true
  transmission_rgb_min: [0.55, 0.55, 0.55]
  transmission_rgb_max: [1.0, 1.0, 1.0]
  neutral_probability: 0.20

Decomposition:
  eps: 1.0e-4
  validation_tolerance: 2.0e-4
  confidence_residual_scale: 0.05
  # Full decomposition passes are still rendered to construct the canonical
  # targets, but diagnostic copies are not persisted in the training corpus.
  save_debug_passes: false

OutputProfile:
  # Keep the lossless linear/HDR tensors consumed by the PRISM loader and the
  # canonical float32 normal/depth maps, while omitting duplicate EXR copies,
  # compatibility aliases, and preview images.
  mode: training
  exr_compression: zip

FlowPNG:
  # u.npy is the canonical sub-pixel float32 displacement target.
  enabled: false

FlowArrows:
  enabled: false
  stride: 8
  canvas_scale: 3
  min_magnitude_px: 0.5
  max_arrows: 1600

ObjectMotion:
  translation_min: [-0.12, -0.10, -0.04]
  translation_max: [0.12, 0.10, 0.04]
  min_translation_distance: 0.08
  start_angle_range: [-20.0, 20.0]
  delta_angle_range: [-40.0, 40.0]

Background:
  # The emissive finite plane avoids object-cast shadows and caustic lighting
  # while retaining an exact 2D source coordinate for every valid ray.
  mode: plane
  z: -1.5
  z_range: [-2.2, -1.0]
  tilt_x_deg_range: [-10.0, 10.0]
  tilt_y_deg_range: [-10.0, 10.0]
  half_size: [5.0, 5.0]
  intensity: 1.0
  intensity_range: [0.75, 1.25]
  ambient_intensity: 1.0
  TextureAugmentation:
    enabled: true
    zoom_range: [0.8, 1.3]
    offset_x_range: [-0.15, 0.15]
    offset_y_range: [-0.15, 0.15]
    rotation_deg_range: [-12.0, 12.0]
    horizontal_flip_probability: 0.5

Scene:
  type: CustomScene
  source_path: ./dataset_resources_research
  scale: 1.0
  integrator:
    type: path
    max_depth: 20
  element:
    - type: transparent_mesh
      mesh_filename: holder.ply
      IoR: 1.5
      reflection_scale: 0.0
      transmittance_rgb: [1.0, 1.0, 1.0]

Camera:
  type: perspective
  fov: 55
  fov_range: [45, 65]
  sampler:
    type: independent
    sample_count: 128
  film:
    type: hdrfilm
    width: 512
    height: 512
    rfilter:
      type: tent
    pixel_format: rgb

CamPose:
  type: RandomCamPose
  target: [0, 0, 0]
  theta_range: [18, 35]
  r_range: [1.8, 2.5]
  shift: [0, 0, 0]
