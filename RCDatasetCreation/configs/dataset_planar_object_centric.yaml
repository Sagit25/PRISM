Project: RefractiveCorresDataset

project_name: planar_object_centric
output_folder: ./result

# 8 backgrounds x 4 sequences x 8 frames = 256 frames per shape.
ior_range: [1.3, 1.65]
backgrounds_per_shape: 8
sequence_num_per_background: 4
frames_per_sequence: 8
dataset_seed: 20260811

Reflection:
  enabled: true
  # Physical dataset default: do not randomly disable or attenuate Fresnel
  # reflection. Use the paired no-ref pass only as auxiliary CR supervision.
  zero_probability: 0.0
  reflection_scale_range: [1.0, 1.0]

Decomposition:
  eps: 1.0e-4
  validation_tolerance: 2.0e-4
  save_debug_passes: true

FlowPNG:
  enabled: true

FlowArrows:
  # Disable for large training runs if storage is more important than preview.
  enabled: true
  stride: 8
  canvas_scale: 3
  min_magnitude_px: 0.5
  max_arrows: 1600

ObjectMotion:
  translation_min: [-0.12, -0.10, -0.04]
  translation_max: [0.12, 0.10, 0.04]
  min_translation_distance: 0.08
  start_angle_range: [-20.0, 20.0]
  delta_angle_range: [-40.0, 40.0]

Background:
  mode: plane
  # z is retained as a backward-compatible nominal value. v9 samples z_range.
  z: -1.5
  z_range: [-2.2, -1.0]
  tilt_x_deg_range: [-10.0, 10.0]
  tilt_y_deg_range: [-10.0, 10.0]
  half_size: [5.0, 5.0]
  intensity: 1.0
  intensity_range: [0.75, 1.25]
  # Background-independent illumination used by F/CF and CR.
  ambient_intensity: 1.0
  TextureAugmentation:
    enabled: true
    # zoom > 1 crops inward; zoom < 1 reveals reflected image borders.
    zoom_range: [0.8, 1.3]
    offset_x_range: [-0.15, 0.15]
    offset_y_range: [-0.15, 0.15]
    rotation_deg_range: [-12.0, 12.0]
    horizontal_flip_probability: 0.5

Tracer:
  # Arbitrarily tilted planes require the two-bounce Mitsuba exit rays.
  backend: mitsuba

Scene:
  type: CustomScene
  source_path: ./dataset_resources
  scale: 1.0
  integrator:
    type: path
    max_depth: 20
  element:
    - type: transparent_mesh
      mesh_filename: holder.ply
      IoR: 1.5
      reflection_scale: 1.0

Camera:
  type: perspective
  fov: 55
  fov_range: [45, 65]
  sampler:
    type: independent
    sample_count: 64
  film:
    type: hdrfilm
    width: 256
    height: 256
    rfilter:
      type: tent
    pixel_format: rgb

# Camera is fixed within a sequence but resampled between sequences.
CamPose:
  type: RandomCamPose
  target: [0, 0, 0]
  theta_range: [18, 35]
  r_range: [1.8, 2.5]
  shift: [0, 0, 0]
