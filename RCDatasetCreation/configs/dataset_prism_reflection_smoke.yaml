Project: RefractiveCorresDataset
project_name: prism_reflection_smoke
output_folder: ./result
split_kind: diagnostic_reflection

ior_range: [1.5, 1.5]
backgrounds_per_shape: 1
sequence_num_per_background: 1
frames_per_sequence: 2
dataset_seed: 20260819

PairedBackground:
  enabled: false
Reflection:
  enabled: true
  zero_probability: 0.0
  reflection_scale_range: [1.0, 1.0]
MaterialRandomization:
  enabled: true
  transmission_rgb_min: [0.65, 0.75, 0.85]
  transmission_rgb_max: [0.85, 0.95, 1.0]
  neutral_probability: 0.0
Decomposition:
  eps: 1.0e-4
  validation_tolerance: 2.0e-3
  confidence_residual_scale: 0.05
  save_debug_passes: true
FlowPNG:
  enabled: true
FlowArrows:
  enabled: true
  stride: 6
  canvas_scale: 3
  min_magnitude_px: 0.25
  max_arrows: 800
ObjectMotion:
  translation_min: [-0.04, -0.03, 0.0]
  translation_max: [0.04, 0.03, 0.0]
  min_translation_distance: 0.03
  start_angle_range: [-8.0, 8.0]
  delta_angle_range: [-18.0, 18.0]
Background:
  mode: plane
  z: -1.4
  z_range: [-1.4, -1.4]
  tilt_x_deg_range: [0.0, 0.0]
  tilt_y_deg_range: [0.0, 0.0]
  half_size: [4.0, 4.0]
  intensity: 1.0
  intensity_range: [1.0, 1.0]
  ambient_intensity: 1.0
  TextureAugmentation:
    enabled: false
    zoom_range: [1.0, 1.0]
    offset_x_range: [0.0, 0.0]
    offset_y_range: [0.0, 0.0]
    rotation_deg_range: [0.0, 0.0]
    horizontal_flip_probability: 0.0
Scene:
  type: CustomScene
  source_path: ./dataset_resources
  scale: 1.0
  integrator:
    type: path
    max_depth: 20
  element:
    - type: transparent_mesh
      mesh_filename: holder.ply
      IoR: 1.5
      reflection_scale: 1.0
      transmittance_rgb: [1.0, 1.0, 1.0]
Camera:
  type: perspective
  fov: 55
  fov_range: [55, 55]
  sampler:
    type: independent
    sample_count: 16
  film:
    type: hdrfilm
    width: 96
    height: 96
    rfilter:
      type: tent
    pixel_format: rgb
CamPose:
  type: RandomCamPose
  target: [0, 0, 0]
  theta_range: [25, 25]
  r_range: [2.1, 2.1]
  shift: [0, 0, 0]
