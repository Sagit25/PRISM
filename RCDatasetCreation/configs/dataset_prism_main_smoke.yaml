Project: RefractiveCorresDataset
project_name: prism_main_smoke
output_folder: ./result
split_kind: main

# Two backgrounds x one sequence x two frames for each train/test shape.
ior_range: [1.42, 1.58]
backgrounds_per_shape: 2
sequence_num_per_background: 1
frames_per_sequence: 2
dataset_seed: 20260818

PairedBackground:
  enabled: true

Reflection:
  enabled: false
  zero_probability: 1.0
  reflection_scale_range: [0.0, 0.0]

MaterialRandomization:
  enabled: true
  transmission_rgb_min: [0.60, 0.65, 0.70]
  transmission_rgb_max: [0.95, 1.00, 1.00]
  neutral_probability: 0.0

Decomposition:
  eps: 1.0e-4
  validation_tolerance: 2.0e-3
  confidence_residual_scale: 0.05
  save_debug_passes: true

FlowPNG:
  enabled: true
FlowArrows:
  enabled: true
  stride: 6
  canvas_scale: 3
  min_magnitude_px: 0.25
  max_arrows: 800

ObjectMotion:
  translation_min: [-0.06, -0.04, -0.02]
  translation_max: [0.06, 0.04, 0.02]
  min_translation_distance: 0.04
  start_angle_range: [-10.0, 10.0]
  delta_angle_range: [-20.0, 20.0]

Background:
  mode: plane
  z: -1.4
  z_range: [-1.5, -1.3]
  tilt_x_deg_range: [-3.0, 3.0]
  tilt_y_deg_range: [-3.0, 3.0]
  half_size: [4.0, 4.0]
  intensity: 1.0
  intensity_range: [0.9, 1.1]
  ambient_intensity: 1.0
  TextureAugmentation:
    enabled: true
    zoom_range: [0.95, 1.05]
    offset_x_range: [-0.04, 0.04]
    offset_y_range: [-0.04, 0.04]
    rotation_deg_range: [-3.0, 3.0]
    horizontal_flip_probability: 0.5

Scene:
  type: CustomScene
  source_path: ./dataset_resources
  scale: 1.0
  integrator:
    type: path
    max_depth: 20
  element:
    - type: transparent_mesh
      mesh_filename: holder.ply
      IoR: 1.5
      reflection_scale: 0.0
      transmittance_rgb: [1.0, 1.0, 1.0]
Camera:
  type: perspective
  fov: 55
  fov_range: [52, 58]
  sampler:
    type: independent
    sample_count: 8
  film:
    type: hdrfilm
    width: 96
    height: 96
    rfilter:
      type: tent
    pixel_format: rgb
CamPose:
  type: RandomCamPose
  target: [0, 0, 0]
  theta_range: [22, 30]
  r_range: [2.0, 2.3]
  shift: [0, 0, 0]
