Project: RefractiveCorresDataset

project_name: cpu_smoke_tree_scene
output_folder: ./result

ior_range: [1.5, 1.5]
backgrounds_per_shape: 1
sequence_num_per_background: 1
frames_per_sequence: 1
dataset_seed: 20260811

Reflection:
  enabled: true
  zero_probability: 0.0
  # Keep the dielectric's physical Fresnel reflection at full strength.
  reflection_scale_range: [1.0, 1.0]

Decomposition:
  eps: 1.0e-4
  validation_tolerance: 1.0e-4
  save_debug_passes: true

FlowPNG:
  enabled: true

FlowArrows:
  enabled: true
  stride: 4
  canvas_scale: 4
  min_magnitude_px: 0.25
  max_arrows: 1200

ObjectMotion:
  translation_min: [0.0, 0.0, 0.0]
  translation_max: [0.0, 0.0, 0.0]
  min_translation_distance: 0.0
  start_angle_range: [0.0, 0.0]
  delta_angle_range: [0.0, 0.0]

Background:
  mode: scene
  intensity: 1.0
  ambient_intensity: 1.0
  # Relative tolerance used to decide whether a refracted 3D hit is also
  # visible at its projection in the object-free clean background image.
  clean_visibility_tolerance: 0.06

Tracer:
  backend: mitsuba

Scene:
  type: CustomScene
  source_path: ./dataset_resources
  scale: 1.0
  integrator:
    type: path
    max_depth: 20
  element:
    - type: transparent_mesh
      mesh_filename: holder.ply
      IoR: 1.5
      reflection_scale: 1.0

Camera:
  type: perspective
  fov: 55
  sampler:
    type: independent
    sample_count: 32
  film:
    type: hdrfilm
    width: 128
    height: 128
    rfilter:
      type: tent
    pixel_format: rgb

# A fixed view puts the single tree behind the transparent object.
CamPose:
  type: SinglePose
  origin: [0.0, -3.0, 0.85]
  target: [0.0, 0.15, 0.10]
  up: [0.0, 0.0, 1.0]
