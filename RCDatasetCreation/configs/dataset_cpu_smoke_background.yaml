Project: RefractiveCorresDataset

project_name: cpu_smoke_background
output_folder: ./result

ior_range: [1.5, 1.5]
backgrounds_per_shape: 1
sequence_num_per_background: 1
frames_per_sequence: 1
dataset_seed: 20260811

Reflection:
  enabled: true
  zero_probability: 0.0
  # Keep the dielectric's physical Fresnel reflection at full strength.
  reflection_scale_range: [1.0, 1.0]

Decomposition:
  eps: 1.0e-4
  validation_tolerance: 1.0e-4
  save_debug_passes: true

FlowPNG:
  # Keep u.npy as canonical float32 displacement and save reversible RGB16 PNG.
  enabled: true

FlowArrows:
  # Saves both a local vector overlay and a two-panel I(x,y) -> B(u,v) view.
  enabled: true
  stride: 4
  canvas_scale: 4
  min_magnitude_px: 0.25
  max_arrows: 1200

ObjectMotion:
  translation_min: [0.0, 0.0, 0.0]
  translation_max: [0.0, 0.0, 0.0]
  min_translation_distance: 0.0
  start_angle_range: [0.0, 0.0]
  delta_angle_range: [0.0, 0.0]

Background:
  mode: plane
  # One deterministic randomized sample is enough to exercise the v9 path.
  z: -1.25
  z_range: [-1.35, -1.15]
  tilt_x_deg_range: [-5.0, 5.0]
  tilt_y_deg_range: [-5.0, 5.0]
  half_size: [4.0, 4.0]
  intensity: 1.0
  intensity_range: [0.9, 1.1]
  # Neutral illumination for background-independent highlights/reflections.
  # Background-independent illumination used by F/CF and CR.
  ambient_intensity: 1.0
  TextureAugmentation:
    enabled: true
    zoom_range: [0.9, 1.1]
    offset_x_range: [-0.08, 0.08]
    offset_y_range: [-0.08, 0.08]
    rotation_deg_range: [-5.0, 5.0]
    horizontal_flip_probability: 0.5

Tracer:
  backend: mitsuba

Scene:
  type: CustomScene
  source_path: ./dataset_resources
  scale: 1.0
  integrator:
    type: path
    max_depth: 20
  element:
    - type: transparent_mesh
      mesh_filename: holder.ply
      IoR: 1.5
      reflection_scale: 1.0

Camera:
  type: perspective
  fov: 55
  fov_range: [52, 58]
  sampler:
    type: independent
    sample_count: 16
  film:
    type: hdrfilm
    width: 96
    height: 96
    rfilter:
      type: tent
    pixel_format: rgb

CamPose:
  type: RandomCamPose
  target: [0, 0, 0]
  theta_range: [25, 25]
  r_range: [2.0, 2.0]
  shift: [0, 0, 0]
