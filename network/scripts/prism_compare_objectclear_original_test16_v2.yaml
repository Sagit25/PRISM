name: prism-compare-objectclear-original-test16-v2
description: Matched 16-sequence held-out PRISM 64px ObjectClear comparison using pinned code cf7952e8efc2fbfbf29d91520c8dfc16cfe6cd2d.
image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
resources:
  cluster: snu-eng-dgx
  preset: a100-1
export:
  /output/: volume://vessl-storage
env:
  WANDB_API_KEY:
    secret: WANDB_API_KEY
  HF_TOKEN:
    secret: HF_TOKEN
run:
  - workdir: /root/workspace
    command: |
      set -Eeuo pipefail
      apt-get update
      apt-get install -y git libgl1 libglib2.0-0 build-essential ninja-build curl
      git init /root/workspace/PRISM
      git -C /root/workspace/PRISM remote add origin https://github.com/Sagit25/PRISM.git
      git -C /root/workspace/PRISM fetch --depth 1 origin cf7952e8efc2fbfbf29d91520c8dfc16cfe6cd2d
      git -C /root/workspace/PRISM checkout --detach FETCH_HEAD
      test "$(git -C /root/workspace/PRISM rev-parse HEAD)" = cf7952e8efc2fbfbf29d91520c8dfc16cfe6cd2d
      export PRISM_BASELINE_RUN_NAME=prism-compare-objectclear-original-test16-v2
      bash /root/workspace/PRISM/network/scripts/launch_official_objectclear_baseline.sh
