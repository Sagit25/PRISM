name: prism-joint-sota-flow-smoke-v11-v2
description: Isolated A100 real-weight SAM2Matting/ObjectClear joint-gradient smoke; startup delegated to a checked repository script after v1 VESSL wrapper parse failure.
image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
resources:
  cluster: snu-eng-dgx
  preset: a100-1
export:
  /output/: volume://vessl-storage
env:
  HF_TOKEN:
    secret: HF_TOKEN
run:
  - workdir: /root/workspace
    command: |
      set -e
      apt-get update
      apt-get install -y git libgl1 libglib2.0-0
      git init /root/workspace/PRISM
      git -C /root/workspace/PRISM remote add origin https://github.com/Sagit25/PRISM.git
      git -C /root/workspace/PRISM fetch --depth 1 origin fc574ca2a4935fefb950140759495083ccfd9f31
      git -C /root/workspace/PRISM checkout --detach FETCH_HEAD
      bash /root/workspace/PRISM/network/scripts/launch_joint_sota_flow_smoke.sh
