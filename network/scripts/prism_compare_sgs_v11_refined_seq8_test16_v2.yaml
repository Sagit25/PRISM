name: prism-compare-sgs-v11-refined-seq8-test16-v2
description: Matched 16-sequence held-out PRISM 64px comparison using pinned code b3d78cdc66ea87e9ad0390aad7f54f1e2b951701.
image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
resources:
  cluster: snu-eng-dgx
  preset: a100-1
export:
  /output/: volume://vessl-storage
env:
  WANDB_API_KEY:
    secret: WANDB_API_KEY
  HF_TOKEN:
    secret: HF_TOKEN
run:
  - workdir: /root/workspace
    command: |
      set -Eeuo pipefail
      apt-get update
      apt-get install -y git libgl1 libglib2.0-0 build-essential ninja-build curl
      git init /root/workspace/PRISM
      git -C /root/workspace/PRISM remote add origin https://github.com/Sagit25/PRISM.git
      git -C /root/workspace/PRISM fetch --depth 1 origin b3d78cdc66ea87e9ad0390aad7f54f1e2b951701
      git -C /root/workspace/PRISM checkout --detach FETCH_HEAD
      test "$(git -C /root/workspace/PRISM rev-parse HEAD)" = b3d78cdc66ea87e9ad0390aad7f54f1e2b951701
      export PRISM_COMPARE_RUN_NAME=prism-compare-sgs-v11-refined-seq8-test16-v2
      export PRISM_COMPARE_VARIANT=refine-inverse
      export PRISM_COMPARE_CPU_OFFLOAD=sequential
      export PRISM_COMPARE_DIFFUSION_STEPS=8
      bash /root/workspace/PRISM/network/scripts/launch_sgs_vessl_comparison_v1.sh
