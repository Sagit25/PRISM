name: prism-compare-sgs-v11-refine-inverse-test16-v1
description: Matched 16-sequence held-out PRISM 64px comparison with inverse B editable by frozen FLUX, pinned code 684de14803a58aa3d2fc7963829c1519e467c128.
image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
resources:
  cluster: snu-eng-dgx
  preset: a100-1
export:
  /output/: volume://vessl-storage
env:
  WANDB_API_KEY:
    secret: WANDB_API_KEY
  HF_TOKEN:
    secret: HF_TOKEN
run:
  - workdir: /root/workspace
    command: |
      set -Eeuo pipefail
      apt-get update
      apt-get install -y git libgl1 libglib2.0-0 build-essential ninja-build curl
      git init /root/workspace/PRISM
      git -C /root/workspace/PRISM remote add origin https://github.com/Sagit25/PRISM.git
      git -C /root/workspace/PRISM fetch --depth 1 origin 684de14803a58aa3d2fc7963829c1519e467c128
      git -C /root/workspace/PRISM checkout --detach FETCH_HEAD
      test "$(git -C /root/workspace/PRISM rev-parse HEAD)" = 684de14803a58aa3d2fc7963829c1519e467c128
      export PRISM_COMPARE_RUN_NAME=prism-compare-sgs-v11-refine-inverse-test16-v1
      export PRISM_COMPARE_VARIANT=refine-inverse
      bash /root/workspace/PRISM/network/scripts/launch_sgs_vessl_comparison_v1.sh
