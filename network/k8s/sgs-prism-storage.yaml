apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prism-storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 200Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: prism-transfer
  labels:
    app: prism-transfer
spec:
  restartPolicy: Never
  terminationGracePeriodSeconds: 10
  containers:
    - name: transfer
      image: alpine/git:latest
      command:
        - /bin/sh
        - -lc
        - sleep infinity
      volumeMounts:
        - name: prism-storage
          mountPath: /data
  volumes:
    - name: prism-storage
      persistentVolumeClaim:
        claimName: prism-storage
