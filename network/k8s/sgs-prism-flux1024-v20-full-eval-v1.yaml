apiVersion: batch/v1
kind: Job
metadata:
  name: prism-kubectl-64-flux1024-v20-full-eval-v1
  namespace: ws-wkuoxg0il92t0
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: checkout
          image: alpine/git:2.47.2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              code_path=/data/code/PRISM-flux1024-v20-full-eval
              commit=9212647fbf050c99b872860661de60b43905dda6
              mkdir -p /data/code
              if [ ! -d "$code_path/.git" ]; then
                git clone --no-checkout https://github.com/Sagit25/PRISM.git "$code_path"
              fi
              git -C "$code_path" fetch origin "$commit"
              git -C "$code_path" checkout --detach "$commit"
              test "$(git -C "$code_path" rev-parse HEAD)" = "$commit"
              echo "PRISM_SGS_CODE_READY $commit"
          volumeMounts:
            - name: prism-storage
              mountPath: /data
      containers:
        - name: evaluate
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - bash /data/code/PRISM-flux1024-v20-full-eval/network/k8s/run_prism_sgs_v7r1.sh
          env:
            - name: PRISM_SGS_RUN_NAME
              value: prism-kubectl-64-flux1024-v20-full-eval-v1
            - name: PRISM_SGS_EXPECTED_COMMIT
              value: 9212647fbf050c99b872860661de60b43905dda6
            - name: PRISM_SGS_EVAL_DONOR_RUN
              value: prism-kubectl-64-flux1024-detail-v20-warmstart-v1
            - name: PRISM_RUN_FINAL_EVALUATION
              value: "true"
            - name: PRISM_LOSS_PROFILE
              value: detail_residual_recovery
            - name: PRISM_OPTICAL_CURRICULUM
              value: "true"
            - name: PRISM_EVAL_WORKERS
              value: "0"
            - name: PRISM_FLUX_DIRECT_OBSERVATION_THRESHOLD
              value: "0.1"
            - name: PRISM_FLUX_REQUIRE_UNANIMOUS_DIRECT_CONSENSUS
              value: "true"
            - name: PRISM_FLUX_MIN_CONSISTENT_OBSERVATIONS
              value: "2"
            - name: PRISM_FLUX_SPATIAL_SINGLETON_EVIDENCE
              value: "true"
            - name: PRISM_REFINE_INVERSE_EVIDENCE
              value: "true"
            - name: PRISM_DIFFUSION_PIXEL_REFINEMENT
              value: "true"
            - name: PRISM_DIFFUSION_MIN_WORKING_SIDE
              value: "1024"
            - name: PRISM_INDEPENDENT_PHYSICAL_ALPHA
              value: "true"
            - name: PRISM_TEMPORAL_ABLATION_CLIP_LENGTHS
              value: "8"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prism-ml-secrets
                  key: WANDB_API_KEY
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prism-ml-secrets
                  key: HF_TOKEN
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: prism-storage
              mountPath: /data
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: prism-storage
          persistentVolumeClaim:
            claimName: prism-storage
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
