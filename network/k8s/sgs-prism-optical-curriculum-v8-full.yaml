apiVersion: batch/v1
kind: Job
metadata:
  name: prism-kubectl-64-optical-curriculum-v8-full-v1
  namespace: ws-wkuoxg0il92t0
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: checkout
          image: alpine/git:2.47.2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              code_path=/data/code/PRISM-optical-curriculum-v8
              commit=504353e16d72c3cb883e91d074b907fdc1aa7876
              mkdir -p /data/code
              if [ ! -d "$code_path/.git" ]; then
                git clone --no-checkout https://github.com/Sagit25/PRISM.git "$code_path"
              fi
              git -C "$code_path" fetch origin "$commit"
              git -C "$code_path" checkout --detach "$commit"
              test "$(git -C "$code_path" rev-parse HEAD)" = "$commit"
              echo "PRISM_SGS_CODE_READY $commit"
          volumeMounts:
            - name: prism-storage
              mountPath: /data
      containers:
        - name: train
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -lc
            - bash /data/code/PRISM-optical-curriculum-v8/network/k8s/run_prism_sgs_v7r1.sh
          env:
            - name: PRISM_SGS_RUN_NAME
              value: prism-kubectl-64-optical-curriculum-v8-full-v1
            - name: PRISM_SGS_EXPECTED_COMMIT
              value: 504353e16d72c3cb883e91d074b907fdc1aa7876
            - name: PRISM_SGS_STAGE1_DONOR_RUN
              value: prism-kubectl-64-flux-observation-speed-v7r6-full-v1
            - name: PRISM_SGS_RUN_TESTS
              value: "true"
            - name: PRISM_LOSS_PROFILE
              value: optical_priority
            - name: PRISM_OPTICAL_CURRICULUM
              value: "true"
            - name: PRISM_STAGE2_EPOCHS
              value: "8"
            - name: PRISM_STAGE3_EPOCHS
              value: "10"
            - name: PRISM_STAGE4_EPOCHS
              value: "12"
            - name: PRISM_EVAL_WORKERS
              value: "0"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prism-ml-secrets
                  key: WANDB_API_KEY
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prism-ml-secrets
                  key: HF_TOKEN
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: prism-storage
              mountPath: /data
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: prism-storage
          persistentVolumeClaim:
            claimName: prism-storage
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
