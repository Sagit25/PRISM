apiVersion: batch/v1
kind: Job
metadata:
  name: prism-kubectl-propainter-comparison-v1-smoke
  namespace: ws-wkuoxg0il92t0
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: checkout
          image: alpine/git:2.47.2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              commit=REPLACE_WITH_FULL_COMMIT
              code_path=/data/code/PRISM-baseline-comparison-$commit
              mkdir -p /data/code
              if [ ! -d "$code_path/.git" ]; then
                git clone --no-checkout https://github.com/Sagit25/PRISM.git "$code_path"
              fi
              git -C "$code_path" fetch origin "$commit"
              git -C "$code_path" checkout --detach "$commit"
              test "$(git -C "$code_path" rev-parse HEAD)" = "$commit"
              echo "PRISM_BASELINE_CHECKOUT_OK $commit"
          volumeMounts:
            - name: prism-storage
              mountPath: /data
      containers:
        - name: evaluate
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - bash /data/code/PRISM-baseline-comparison-REPLACE_WITH_FULL_COMMIT/network/k8s/run_prism_propainter_comparison_v1.sh
          env:
            - name: PRISM_BASELINE_RUN_NAME
              value: prism-kubectl-propainter-comparison-v1-smoke
            - name: PRISM_BASELINE_EXPECTED_COMMIT
              value: REPLACE_WITH_FULL_COMMIT
            - name: PRISM_BASELINE_MAX_SEQUENCES
              value: "16"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prism-ml-secrets
                  key: WANDB_API_KEY
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prism-ml-secrets
                  key: HF_TOKEN
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: prism-storage
              mountPath: /data
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: prism-storage
          persistentVolumeClaim:
            claimName: prism-storage
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
