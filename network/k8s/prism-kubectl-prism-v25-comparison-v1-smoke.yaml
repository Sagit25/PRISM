apiVersion: batch/v1
kind: Job
metadata:
  name: prism-kubectl-prism-v25-comparison-v1-smoke
  namespace: ws-wkuoxg0il92t0
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: checkout
          image: alpine/git:2.47.2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              commit=REPLACE_WITH_FULL_COMMIT
              code_path=/data/code/PRISM-baseline-comparison-$commit
              mkdir -p /data/code
              if [ ! -d "$code_path/.git" ]; then
                git clone --no-checkout https://github.com/Sagit25/PRISM.git "$code_path"
              fi
              git -C "$code_path" fetch origin "$commit"
              git -C "$code_path" checkout --detach "$commit"
              test "$(git -C "$code_path" rev-parse HEAD)" = "$commit"
              echo "PRISM_COMPARISON_CHECKOUT_OK $commit"
          volumeMounts:
            - name: prism-storage
              mountPath: /data
      containers:
        - name: evaluate
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          command: ["/bin/bash", "-lc"]
          args:
            - bash /data/code/PRISM-baseline-comparison-REPLACE_WITH_FULL_COMMIT/network/k8s/run_prism_v25_comparison_v1.sh
          env:
            - name: PRISM_SGS_RUN_NAME
              value: prism-kubectl-prism-v25-comparison-v1-smoke
            - name: PRISM_SGS_EXPECTED_COMMIT
              value: REPLACE_WITH_FULL_COMMIT
            - name: PRISM_SGS_EVAL_DONOR_RUN
              value: prism-kubectl-64-foreground-detail-v25-joint-v2
            - name: PRISM_COMPARISON_MAX_SEQUENCES
              value: "8"
            - name: PRISM_LOSS_PROFILE
              value: balanced_detail_recovery
            - name: PRISM_TRAINING_SCHEDULE
              value: oracle_joint
            - name: PRISM_FOREGROUND_REFINEMENT
              value: "true"
            - name: PRISM_FOREGROUND_DETAIL_REFINEMENT
              value: "true"
            - name: PRISM_FLOW_GUIDED_LATENT_BRIDGE
              value: "true"
            - name: PRISM_USE_MAM2_FOREGROUND_PRIOR
              value: "true"
            - name: PRISM_OPTICAL_CURRICULUM
              value: "true"
            - name: PRISM_DIFFUSION_PIXEL_REFINEMENT
              value: "true"
            - name: PRISM_DIFFUSION_MIN_WORKING_SIDE
              value: "1024"
            - name: PRISM_INDEPENDENT_PHYSICAL_ALPHA
              value: "true"
            - name: PRISM_TEMPORAL_ABLATION_CLIP_LENGTHS
              value: "8"
            - name: PRISM_EVAL_WORKERS
              value: "0"
            - name: PRISM_FLUX_DIRECT_OBSERVATION_THRESHOLD
              value: "0.1"
            - name: PRISM_FLUX_REQUIRE_UNANIMOUS_DIRECT_CONSENSUS
              value: "true"
            - name: PRISM_FLUX_MIN_CONSISTENT_OBSERVATIONS
              value: "2"
            - name: PRISM_FLUX_SPATIAL_SINGLETON_EVIDENCE
              value: "true"
            - name: PRISM_REFINE_INVERSE_EVIDENCE
              value: "true"
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: prism-ml-secrets
                  key: WANDB_API_KEY
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: prism-ml-secrets
                  key: HF_TOKEN
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: prism-storage
              mountPath: /data
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: prism-storage
          persistentVolumeClaim:
            claimName: prism-storage
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
