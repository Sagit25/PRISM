apiVersion: batch/v1
kind: Job
metadata:
  name: prism-kubectl-128-generation-full-20261105-v2
  namespace: ws-wkuoxg0il92t0
spec:
  suspend: true
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 120
      initContainers:
        - name: checkout
          image: alpine/git:2.47.2
          command: ["/bin/sh", "-ec"]
          args:
            - |
              code=/data/code/PRISM-128-generation-20261105
              commit=REPLACE_WITH_FULL_COMMIT
              test -d "$code/.git"
              git -C "$code" fetch origin "$commit"
              git -C "$code" checkout --detach "$commit"
              test "$(git -C "$code" rev-parse HEAD)" = "$commit"
              test -L "$code/RCDatasetCreation/dataset_resources_research"
              test -f /data/datasets/prism-main-128-20261105/prism_main_128_smoke_20261105/.generation_complete
              echo "PRISM_128_CODE_READY $commit"
          volumeMounts:
            - name: storage
              mountPath: /data
      containers:
        - name: generate
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              code=/data/code/PRISM-128-generation-20261105
              test -x "$code/.venv/bin/python"
              free_kib=$(df -Pk /data | awk 'NR==2 {print $4}')
              required_kib=$((75 * 1024 * 1024))
              if [ "$free_kib" -lt "$required_kib" ]; then
                echo "PRISM_128_INSUFFICIENT_SPACE available_kib=$free_kib required_kib=$required_kib"
                exit 1
              fi
              export PRISM_128_WORKSPACE="$code"
              export PRISM_128_OUTPUT_ROOT=/data/datasets/prism-main-128-20261105
              export PRISM_128_CUDA_VISIBLE_DEVICES=0
              export PRISM_128_DATASET_VERSION=20261105
              export PRISM_128_SMOKE_ONLY=false
              bash "$code/RCDatasetCreation/tools/run_prism_128_server.sh"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OPENCV_IO_ENABLE_OPENEXR
              value: "1"
          resources:
            limits:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: storage
              mountPath: /data
            - name: shared-memory
              mountPath: /dev/shm
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: prism-storage
        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
