[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refractive-mam2"
version = "0.5.0"
description = "Joint reusable-background and colored refractive-operator decomposition on official SAM2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5.1",
  "numpy>=1.24",
]

[project.optional-dependencies]
sam2 = ["hydra-core>=1.3", "iopath>=0.1.10", "numpy>=1.24", "pillow>=10", "torchvision>=0.20.1"]
data = ["numpy>=1.24", "opencv-python-headless>=4.8"]
test = ["pytest>=7.4"]
experiment = ["wandb>=0.17"]
evaluation = ["lpips>=0.1.4", "torchvision>=0.20.1"]
diffusion = [
  "diffusers>=0.35",
  "transformers>=4.48",
  "accelerate>=1.0",
  "safetensors>=0.4",
  "numpy>=1.24",
  "pillow>=10",
]

[project.scripts]
prism-train = "refractive_mam2.train:main"
prism-compare = "refractive_mam2.compare:main"

[tool.setuptools]
packages = ["refractive_mam2"]
package-dir = {refractive_mam2 = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
