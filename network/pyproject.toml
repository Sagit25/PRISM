[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "refractive-mam2"
version = "0.6.0"
description = "Joint reusable-background and colored refractive-operator decomposition on official SAM2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5.1,<2.6",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
sam2 = ["hydra-core>=1.3,<2", "iopath>=0.1.10,<0.2", "numpy>=1.24,<3", "pillow>=10,<13", "torchvision>=0.20.1,<0.21"]
data = ["numpy>=1.24,<3", "opencv-python-headless>=4.8,<5"]
test = ["pytest>=7.4"]
experiment = ["wandb>=0.17,<1"]
evaluation = ["lpips>=0.1.4,<0.2", "torchvision>=0.20.1,<0.21"]
diffusion = [
  "diffusers>=0.35,<1",
  "transformers>=4.48,<5",
  "accelerate>=1.0,<2",
  "safetensors>=0.4,<1",
  "sentencepiece>=0.2,<1",
  "numpy>=1.24,<3",
  "pillow>=10,<13",
]

[project.scripts]
prism-train = "refractive_mam2.train:main"
prism-compare = "refractive_mam2.compare:main"

[tool.setuptools]
packages = ["refractive_mam2"]
package-dir = {refractive_mam2 = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
